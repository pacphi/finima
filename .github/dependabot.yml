version: 2

updates:
  # Rust (Cargo) — root workspace
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(rust):"
    labels:
      - dependencies
      - rust

  # TypeScript / Node (pnpm) — frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ts):"
    labels:
      - dependencies
      - typescript

  # Docker — backend
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker):"
    labels:
      - dependencies
      - docker

  # Docker — frontend
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker):"
    labels:
      - dependencies
      - docker

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions):"
    labels:
      - dependencies
      - github-actions
