[workspace]
members = [
    "crates/finima-core",
    "crates/finima-db",
    "crates/finima-api",
    "crates/finima-auth",
    "crates/finima-ingest",
    "crates/finima-llm",
    "crates/finima-analysis",
    "crates/finima-feed",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["query"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "limit", "set-header"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Auth
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# File parsing
calamine = { version = "0.26", features = ["dates"] }
csv = "1"
quick-xml = "0.37"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/time, UUID, Decimal
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Configuration
config = "0.15"

# Feed parsing
feed-rs = "2"

# Object storage (S3-compatible)
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
bytes = "1"

# Metrics
prometheus-client = "0.23"

# Misc
thiserror = "2"
async-trait = "0.1"

# Hardware detection
sysinfo = "0.33"
