# Recurring-payment detector tuning.
#
# A merchant qualifies as a "Variable" recurring payment only when it has
# at least `min_occurrences_for_variable` transactions inside a sliding
# window of `variable_window_months` months (anchored on the merchant's
# most recent transaction). Anything below the threshold is treated as
# noise and dropped from the recurring list.
#
# `min_occurrences_for_fixed` applies to sub-annual fixed cadences
# (weekly / biweekly / monthly / quarterly): per ADR-019, at least 3
# matching transactions are required before a candidate is promoted,
# matching Plaid's "matured stream" floor. Semiannual and annual cadences
# are exempt because a 3-sample floor would require >= 2 years of history.
# Note: the `daily` cadence has been removed from the classifier (ADR-019);
# genuinely daily consumer-finance patterns are vanishingly rare and the
# band produced false positives on same-day merchant bursts.

recurring:
  min_occurrences_for_variable: 3
  variable_window_months: 6
  min_occurrences_for_fixed: 3
  # Minimum span (months) between a candidate's first and last observation
  # before a sub-annual/variable cadence is trusted. Guards against short
  # bursts whose median interval happens to look periodic. Semiannual and
  # annual cadences are exempt (they can't reach their own thresholds
  # without more than a year of history).
  min_history_months: 6
