# Development overrides
# Inherits from default.yaml; only override what differs.

database:
  url: "postgres://finima:finima_dev@localhost:5432/finima"
  max_connections: 5

logging:
  # App crates at debug; suppress noisy networking/db dependencies.
  level: "debug,h2=warn,hyper_util=warn,hyper=warn,reqwest=warn,rustls=warn,tower_http=warn,sqlx=warn"
  format: "pretty"
  # Write daily-rotating plain-text logs alongside console output.
  log_dir: "data/logs"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
