# OpenTelemetry Collector configuration for Finima
# Used by the SigNoz observability stack.

receivers:
  # Scrape Prometheus metrics from the backend /metrics endpoint
  prometheus:
    config:
      scrape_configs:
        - job_name: "finima-backend"
          scrape_interval: 15s
          static_configs:
            - targets: ["backend:3000"]
          metrics_path: "/metrics"

  # Receive OTLP data (traces, metrics, logs) from instrumented services
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # Collect Docker container logs
  filelog:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%fZ"
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: move
        from: attributes.attrs.tag
        to: resource["docker.tag"]
        if: attributes.attrs.tag != nil

processors:
  batch:
    send_batch_size: 10000
    timeout: 10s

  # Add resource attributes for better identification in SigNoz
  resource:
    attributes:
      - key: service.namespace
        value: finima
        action: upsert
      - key: deployment.environment
        value: ${APP_ENV:-development}
        action: upsert

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Export to SigNoz via OTLP
  otlp/signoz:
    endpoint: ${SIGNOZ_ENDPOINT:-signoz:4317}
    tls:
      insecure: true

  # Debug logging (disabled in production)
  logging:
    verbosity: basic

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  zpages:
    endpoint: "0.0.0.0:55679"

service:
  extensions: [health_check, zpages]
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/signoz]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/signoz]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/signoz]
