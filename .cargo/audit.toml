# Cargo audit configuration
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Non-actionable transitive advisory exceptions — reviewed by maintainers.
# See each entry in /audit-ignore for full rationale. Mirrored here so
# `cargo audit` picks them up directly (.cargo/audit.toml is the canonical
# config path searched from the Cargo.lock directory).

[advisories]
ignore = [
    # rsa Marvin attack — reachable only via sqlx-mysql (unused at runtime)
    "RUSTSEC-2023-0071",

    # rand unsoundness — `log` feature not enabled; vulnerable path compiled out
    "RUSTSEC-2026-0097",

    # Unmaintained informational advisories for deep transitive deps
    "RUSTSEC-2025-0141",  # bincode
    "RUSTSEC-2026-0105",  # core2 (yanked)
    "RUSTSEC-2025-0057",  # fxhash
    "RUSTSEC-2025-0119",  # number_prefix
    "RUSTSEC-2024-0436",  # paste

    # rkyv 0.7.46 OOB reads — reachable only via rust_decimal's unused "rkyv" feature
    "RUSTSEC-2026-0235",

    # lru 0.16.4 use-after-free risk — hard-pinned by aws-sdk-s3 "^0.16.3"; fix is in 0.18+
    "RUSTSEC-2026-0253",
]

[yanked]
# core2 0.4.0 (pulled via mistralrs -> image -> ravif -> rav1e -> bitstream-io)
# has all versions yanked from crates.io. The RUSTSEC-2026-0105 advisory above
# already covers the unmaintained status; the separate "yanked" warning has no
# advisory ID and cannot be filtered per-crate. Disable yanked checks until
# the upstream ML stack migrates away from core2.
enabled = false

