# pipeline.yml — the autopilot feature pipeline manifest.
# Lives at .autopilot/pipeline.yml. Generated by `autopilot:plan` from OPTIMIZATION_SPEC.md
# (the rust-optimizer CI/CD audit of this repo). Full A-F scope, per user request.

feature_id: "rust-ci-optimization"
goal: "Apply the rust-optimizer CI/CD audit findings (A1, C2, A3, A4, A6, C1, D2, F1) to finima's GitHub Actions CI and Cargo dependency set — faster, more correct CI, no application behavior change."
spec: "OPTIMIZATION_SPEC.md"

references:
  prd:     ""
  plan:    "OPTIMIZATION_SPEC.md"
  adr_dir: "docs/ADRs"
  ddd_dir: "docs/DDDs"
  extra:   [".optimizer/baseline.json"]

trunk: main
base:  chore/rust-ci-optimization

autonomy: reviewed   # per OPTIMIZATION_SPEC.md's own recommendation for the first pass

fix_budget: 5
max_parallel: 1
requeue_budget: 2

risk_phases: [6, 7]   # A1 (build-once restructuring) and F1 (dependency removal) — human checkpoint

court: auto

# ─────────────────────────────────────────────────────────────────────────────
# PHASES — one per OPTIMIZATION_SPEC.md finding, in the spec's own suggested_sequence:
# [A3, A6, D2, C1, A4, C2, A1, F1]. Mirrored 1:1 as beads issues finima-w2q.1..8
# (epic finima-w2q), with finima-w2q.7 (A1) blocked on finima-w2q.6 (C2) — same edge as
# phase 6's depends_on: [5] below (both touch the same ci.yml job block; C2's restructuring
# must land first so A1 isn't racing it).
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: 0
    goal: "CI env carries the two flags that shrink target/ and relieve disk pressure (root cause of the B1 disk-hack smell, which this repo doesn't have — kept that way)."
    track: "ci-cd"
    deliverables:
      - "CARGO_INCREMENTAL: \"0\" and CARGO_PROFILE_TEST_DEBUG: \"0\" added to .github/workflows/ci.yml's top-level env: block."
    definition_of_done:
      - "grep: CARGO_INCREMENTAL:.*0 in .github/workflows/ci.yml"
      - "grep: CARGO_PROFILE_TEST_DEBUG:.*0 in .github/workflows/ci.yml"
      - "cmd: make lint"
      - "cmd: make test"
    conventions: "Keep alongside the existing CARGO_TERM_COLOR/RUST_BACKTRACE env vars; no new job needed."
    depends_on: []
    touches: [".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 1
    goal: "cargo-audit installs from a prebuilt binary instead of compiling from source every run."
    track: "ci-cd"
    deliverables:
      - "backend-audit job in .github/workflows/ci.yml uses taiki-e/install-action for cargo-audit instead of `cargo install cargo-audit --locked`."
    definition_of_done:
      - "grep: taiki-e/install-action in .github/workflows/ci.yml"
      - "grep:absent: cargo install cargo-audit in .github/workflows/ci.yml"
      - "cmd: make audit"
    conventions: "Keep .github/scripts/cargo-audit.sh and audit-ignore untouched — only the install step changes."
    depends_on: []
    touches: [".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 2
    goal: "E2E artifact uploads no longer fail the job when Playwright produces no report/traces."
    track: "ci-cd"
    deliverables:
      - "if-no-files-found: ignore added to the playwright-report and playwright-traces upload-artifact steps in .github/workflows/ci.yml."
    definition_of_done:
      - "grep: if-no-files-found: ignore in .github/workflows/ci.yml"
    conventions: ""
    depends_on: []
    touches: [".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 3
    goal: "Superseded PR pushes cancel in-flight runs instead of piling up."
    track: "ci-cd"
    deliverables:
      - "A concurrency: { group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true } block added to .github/workflows/ci.yml."
    definition_of_done:
      - "grep: cancel-in-progress:.*true in .github/workflows/ci.yml"
    conventions: "Scope the group to workflow+ref so main pushes and PR runs don't cancel each other incorrectly."
    depends_on: []
    touches: [".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 4
    goal: "Link step uses lld instead of the default linker."
    track: "ci-cd"
    deliverables:
      - ".cargo/config.toml added with -Clink-arg=-fuse-ld=lld for the x86_64-unknown-linux-gnu target."
      - "lld installed as a CI step before any cargo build/test/clippy invocation in ci.yml."
    definition_of_done:
      - "grep: fuse-ld=lld in .cargo/config.toml"
      - "cmd: make build"
      - "cmd: make test"
    conventions: "Runner is ubuntu-latest — installed via apt (apt-get install -y lld) or a maintained action; don't hardcode a specialty runner label."
    depends_on: []
    touches: [".cargo/config.toml", ".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 5
    goal: "backend-lint and backend-test run in parallel; a single ci-success job still requires both (and every other required job) before merge."
    track: "ci-cd"
    deliverables:
      - "`needs: backend-lint` removed from backend-test and llm-test in .github/workflows/ci.yml."
      - "A ci-success aggregation job added that `needs:` all required jobs (backend-lint, backend-test, backend-audit, frontend-lint, frontend-test, validate-markdown, validate-yaml) so branch protection can point at one check."
    definition_of_done:
      - "grep:absent: needs: backend-lint in .github/workflows/ci.yml"
      - "grep: ci-success in .github/workflows/ci.yml"
      - "cmd: make lint"
      - "cmd: make test"
    conventions: "e2e-test and llm-test stay conditional (vars.E2E_ENABLED / vars.LLM_TESTS_ENABLED) — don't fold them into the required ci-success set unless the vars are on."
    depends_on: []
    touches: [".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 6
    goal: "The workspace is compiled once for the debug/test profile and the result is reused, instead of clippy and cargo test each paying a full compile."
    track: "ci-cd"
    deliverables:
      - "A nextest-archive-producing step (cargo nextest archive --archive-file nextest.tar.zst) added to the job that already compiles the workspace for testing."
      - "backend-test (and llm-test, when vars.LLM_TESTS_ENABLED) consume the archive via `cargo nextest run --archive-file ...` instead of invoking `cargo test` from scratch."
    definition_of_done:
      - "grep: nextest archive in .github/workflows/ci.yml"
      - "grep: archive-file in .github/workflows/ci.yml"
      - "cmd: make test"
      - "cmd: make test-integration"
    conventions: "This is the riskiest phase in the pipeline — it restructures the job graph C2 just parallelized. Verify the archive approach preserves the postgres service container each consuming job needs (services: are per-job, not shared by an archive)."
    depends_on: [5]
    touches: [".github/workflows/ci.yml"]
    adrs: []
    ddd: []

  - id: 7
    goal: "Every cargo-machete hit is either removed (compiler-verified dead weight) or documented as a false positive — no blind deletions."
    track: "dependencies"
    deliverables:
      - "Each of the 13 candidate unused deps (finima-feed: serde_json, uuid; finima-api: aws-config, axum-extra, base64, bytes; finima-ingest: serde_json, tracing; finima-db: tokio, tracing; finima-llm: finima-core, tokenizers; finima-auth: serde_json) is either removed from its crate's Cargo.toml, or added to that crate's [package.metadata.cargo-machete] ignored list with a one-line rationale comment."
    definition_of_done:
      - "cmd: cargo machete"
      - "cmd: cargo build --workspace"
      - "cmd: make test"
    conventions: "cargo-machete has known false positives for macro-only/re-exported/feature-enabling deps — verify each hit against actual usage before removing; the compiler and test suite are the arbiter, not the grep hit alone."
    depends_on: []
    touches: ["crates/*/Cargo.toml"]
    adrs: ["ADR-001-rust-multi-crate-workspace"]
    ddd: []
