# pnpm 11 settings. `overrides` moved here from package.json's `pnpm` field,
# which pnpm 11 no longer reads (https://pnpm.io/settings).

# pnpm 11 enables a 24h minimum-release-age supply-chain delay by default, which
# blocks frozen installs (and CI) on dependency versions published <24h ago —
# e.g. same-day Dependabot bumps. Disable it to keep the pnpm 10 install
# behavior and deterministic CI. Raise to a minute count to re-enable.
minimumReleaseAge: 0

# Security pins for transitive advisories — remove an entry once the parent
# dependency ships the patched version on its own.
overrides:
  # GHSA-rgw5-rvv9-x895 — brace-expansion DoS via unbounded intermediate arrays,
  # bypassing the GHSA-jxxr-4gwj-5jf2 mitigation below (transitive: eslint > minimatch)
  brace-expansion@>=4.0.0 <5.0.9: ">=5.0.9"
  # GHSA-4x5r-pxfx-6jf8 — @babel/core arbitrary file read (transitive: eslint-plugin-react-hooks)
  "@babel/core@<7.29.6": ">=7.29.6"
  # GHSA-2v37-7h3g-55p8 — nanoid infinite loop when a custom generator's size is
  # zero (transitive: vite > postcss > nanoid, which requires the 3.x line)
  "nanoid@<3.3.17": ">=3.3.17 <4"
