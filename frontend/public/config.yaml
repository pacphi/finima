api:
  base_url: "http://localhost:3000"
  ws_url: "ws://localhost:3000"

features:
  news_feed: true
  flow_analysis: true

defaults:
  currency: "USD"
  date_format: "MM/DD/YYYY"
  theme: "system"

dashboard:
  # Sliding window (in days) used by the Dashboard's "Upcoming" tile to
  # filter recurring bills and income by `next_expected_date`. Keep this
  # small so the tile surfaces only items due imminently.
  upcoming_window_days: 7
