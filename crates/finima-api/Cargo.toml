[package]
name = "finima-api"
version = "0.1.0"
edition = "2021"

[dependencies]
finima-core = { path = "../finima-core", features = ["axum"] }
finima-db = { path = "../finima-db" }
finima-auth = { path = "../finima-auth" }
finima-ingest = { path = "../finima-ingest" }
finima-llm = { path = "../finima-llm", default-features = false }
finima-categorize = { path = "../finima-categorize" }
finima-analysis = { path = "../finima-analysis" }
finima-feed = { path = "../finima-feed" }
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
tower = "0.5"
http = "1"
base64 = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
bytes = { workspace = true }
prometheus-client = { workspace = true }
thiserror = { workspace = true }
dotenvy = "0.15"

[[bin]]
name = "finima-api"
path = "src/main.rs"

[[bin]]
name = "merchant-audit"
path = "src/bin/merchant_audit.rs"

[[bin]]
name = "finima-normalize-directions"
path = "src/bin/normalize_directions.rs"

[[bin]]
name = "finima-redetect-recurring"
path = "src/bin/redetect_recurring.rs"

[[bin]]
name = "bootstrap_flows"
path = "src/bin/bootstrap_flows.rs"

[features]
candle = ["finima-llm/candle"]
metal = ["candle", "finima-llm/metal"]
cuda = ["candle", "finima-llm/cuda"]
ollama = ["finima-llm/ollama"]
# Enables the RuVector + SONA Tier 2 categorization backend (ADR-012).
# Off by default in Phase 1; Phase 3 will decide rollout.
sona = ["finima-categorize/sona", "finima-analysis/sona"]

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }

# Library crates needed to construct the test app (finima-api is a binary crate)
finima-core = { path = "../finima-core", features = ["axum"] }
finima-db = { path = "../finima-db" }
finima-auth = { path = "../finima-auth" }
finima-llm = { path = "../finima-llm", default-features = false }
axum = { workspace = true }
tower-http = { workspace = true }
