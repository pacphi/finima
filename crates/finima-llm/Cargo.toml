[package]
name = "finima-llm"
version.workspace = true
edition = "2021"

[features]
default = ["ollama"]
ollama = ["dep:reqwest"]
candle = ["dep:mistralrs", "dep:hf-hub", "dep:tokenizers", "dep:tracing-subscriber"]
cuda = ["candle", "mistralrs/cuda"]
metal = ["candle", "mistralrs/metal"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }

# Hardware detection
sysinfo = { workspace = true }

# Ollama backend (HTTP)
reqwest = { workspace = true, optional = true }

# Tracing (needed by the download_model binary)
tracing-subscriber = { workspace = true, optional = true }

# Candle/mistral.rs backend (in-process inference)
mistralrs = { version = "0.8", optional = true, default-features = false }
hf-hub = { version = "0.5", optional = true }
tokenizers = { version = "0.23", optional = true }

[[bin]]
name = "download_model"
required-features = ["candle"]

[package.metadata.cargo-machete]
# tokenizers: flagged unused under default features (it's gated behind the
# optional `candle` feature, which pulls in heavy ML deps not exercised by a
# default `cargo build --workspace`). Not directly referenced by our own
# code — mistralrs' Candle API surface may pull it in transitively — so this
# is left as a documented ignore rather than a blind removal that would need
# a full --features candle build to verify safely.
ignored = ["tokenizers"]
