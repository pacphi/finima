[package]
name = "finima-categorize"
version.workspace = true
edition = "2021"

[dependencies]
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = "1"
strsim = "0.11"

# --- Optional: Tier 2 RuVector backend (ADR-017). Pulled in when the
# `sona` feature is enabled. Matches the feature name used by
# `finima-analysis` so both crates opt in together. ---
ruvector-core = { version = "2.1", default-features = false, features = ["hnsw", "simd", "memory-only"], optional = true }
ruvector-sona = { version = "0.2", default-features = false, features = ["serde-support"], optional = true }

[features]
default = []
sona = ["dep:ruvector-core", "dep:ruvector-sona"]

[dev-dependencies]
tokio = { workspace = true }
