[package]
name = "finima-analysis"
version.workspace = true
edition = "2021"

[dependencies]
finima-core = { path = "../finima-core" }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
ruvector-core = { version = "2.1", default-features = false, features = ["hnsw", "simd", "memory-only"], optional = true }
ruvector-sona = { version = "0.2", default-features = false, features = ["serde-support"], optional = true }

[features]
sona = ["dep:ruvector-core", "dep:ruvector-sona"]

[dev-dependencies]
rust_decimal_macros = "1"
